name: Build and Release Debian Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Construir o pacote .deb
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME#v}"
          PKG_NAME="ananicy-debian"
          BUILD_DIR="${PKG_NAME}-${VERSION}"

          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}/DEBIAN"

          cp -a DEBIAN/. "${BUILD_DIR}/DEBIAN/"
          cp -a etc lib usr "${BUILD_DIR}/"

          sed -i "s/^Version: .*/Version: ${VERSION}/" "${BUILD_DIR}/DEBIAN/control"

          test -x "${BUILD_DIR}/usr/bin/ananicy-cpp"
          test -x "${BUILD_DIR}/DEBIAN/postinst"
          test -x "${BUILD_DIR}/DEBIAN/prerm"
          test -x "${BUILD_DIR}/DEBIAN/postrm"

          dpkg-deb --build --root-owner-group \
            "${BUILD_DIR}" "${PKG_NAME}_${VERSION}_amd64.deb"
          dpkg-deb --info "${PKG_NAME}_${VERSION}_amd64.deb"

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
