name: Build and Release Debian Package

# A rotina será executada automaticamente sempre que você enviar uma tag começando com "v" (ex: v1.2.49)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do seu repositório para a máquina virtual do GitHub
    - name: Checkout do código
      uses: actions/checkout@v4

    # 2. Executa a estruturação e criação do .deb
    - name: Construir o pacote .deb
      run: |
        # Extrai o número da versão a partir do nome da tag (ex: v1.2.49 -> 1.2.49)
        VERSION=${GITHUB_REF#refs/tags/v}
        PKG_NAME="ananicy-cpp-rules"
        BUILD_DIR="${PKG_NAME}-${VERSION}"

        # Cria a estrutura de diretórios do pacote Debian
        mkdir -p ${BUILD_DIR}/DEBIAN
        mkdir -p ${BUILD_DIR}/usr/bin
        mkdir -p ${BUILD_DIR}/etc/ananicy.d
        mkdir -p ${BUILD_DIR}/lib/systemd/system

        # Gera o arquivo control dinamicamente
        cat <<EOF > ${BUILD_DIR}/DEBIAN/control
        Package: ${PKG_NAME}
        Version: ${VERSION}
        Architecture: amd64
        Maintainer: nilocnt
        Depends: systemd, libc6, libstdc++6
        Description: Ananicy-CPP daemon with community-driven rules from CachyOS.
        EOF

        # Copia os arquivos do repositório para a estrutura do pacote
        # Ajuste os diretórios de origem abaixo conforme a organização real do seu repositório
        cp ananicy-cpp ${BUILD_DIR}/usr/bin/
        cp -r rules/* ${BUILD_DIR}/etc/ananicy.d/
        cp ananicy-cpp.service ${BUILD_DIR}/lib/systemd/system/

        # Ajusta permissões
        chmod 755 ${BUILD_DIR}/DEBIAN
        chmod 755 ${BUILD_DIR}/usr/bin/ananicy-cpp

        # Constrói o arquivo .deb
        dpkg-deb --build ${BUILD_DIR}

    # 3. Publica o .deb gerado na aba "Releases" do GitHub
    - name: Publicar Release
      uses: softprops/action-gh-release@v1
      with:
        files: "*.deb"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}